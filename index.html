<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự biến thiên tốc độ phản ứng thuận và phản ứng nghịch theo thời gian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Nền xanh navy/slate đậm */
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto;
        }

        header {
            text-align: center;
            padding: 1rem 0;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        .title-glow {
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5), 0 0 20px rgba(34, 211, 238, 0.3);
        }

        #graph-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
        }

        /* Styles cho các đường đồ thị */
        .axis { stroke: #64748b; stroke-width: 3; fill: none; }
        .axis-label { fill: #94a3b8; font-size: 20px; font-weight: 600; }
        
        .line-thuận { stroke: #f97316; stroke-width: 6; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 6px #f97316); }
        .line-nghịch { stroke: #06b6d4; stroke-width: 6; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 6px #06b6d4); }
        
        /* Đoạn cân bằng xen kẽ màu */
        .line-eq-thuận { stroke: #f97316; stroke-width: 6; fill: none; stroke-dasharray: 15 15; stroke-linecap: butt; filter: drop-shadow(0 0 4px #f97316); }
        .line-eq-nghịch { stroke: #06b6d4; stroke-width: 6; fill: none; stroke-dasharray: 15 15; stroke-dashoffset: 15; stroke-linecap: butt; filter: drop-shadow(0 0 4px #06b6d4); }

        .line-dashed { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
        
        /* Nhãn chú thích */
        .label-thuận { fill: #f97316; font-size: 22px; font-weight: bold; }
        .label-nghịch { fill: #06b6d4; font-size: 22px; font-weight: bold; }
        .label-eq { fill: #fbbf24; font-size: 24px; font-weight: bold; text-anchor: middle; opacity: 0; transition: opacity 0.5s; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.8)); }
        
        .moving-note {
            fill: #e2e8f0;
            font-size: 18px;
            font-style: italic;
            text-anchor: middle;
            background: rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }

        /* Controls */
        #controls {
            padding: 1.5rem;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 10;
            flex-shrink: 0;
            margin-top: auto;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .btn-play { background: #10b981; color: white; }
        .btn-play:hover { background: #059669; }
        .btn-pause { background: #f59e0b; color: white; }
        .btn-pause:hover { background: #d97706; }
        .btn-reset { background: #64748b; color: white; }
        .btn-reset:hover { background: #475569; }
        .btn-fast { background: #3b82f6; color: white; }
        .btn-fast:hover { background: #2563eb; }
        .btn-toggle { background: #8b5cf6; color: white; }
        .btn-toggle:hover { background: #7c3aed; }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #22d3ee;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="text-3xl md:text-4xl font-extrabold title-glow tracking-wide">
            Sự biến thiên tốc độ phản ứng thuận và phản ứng nghịch theo thời gian
        </h1>
    </header>

    <div id="graph-container">
        <!-- SVG viewBox rộng để render nét căng, tự động co giãn theo container -->
        <svg viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet" id="graph-svg">
            <!-- Mũi tên trục -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
                </marker>
            </defs>

            <!-- Trục tọa độ -->
            <path class="axis" d="M 100,550 L 1150,550" marker-end="url(#arrow)"/> <!-- Trục t -->
            <path class="axis" d="M 100,550 L 100,50" marker-end="url(#arrow)"/>  <!-- Trục v -->

            <!-- Nhãn trục -->
            <text x="1100" y="580" class="axis-label">Thời gian (t)</text>
            <text x="30" y="70" class="axis-label" transform="rotate(-90 30,70)">Tốc độ phản ứng (v)</text>
            <text x="80" y="570" class="axis-label">0</text>

            <!-- Các thành phần sẽ được vẽ bằng JS -->
            <!-- 1. Giai đoạn chưa đạt cân bằng -->
            <path id="path-thuan" class="line-thuận" d=""/>
            <path id="path-nghich" class="line-nghịch" d=""/>
            
            <!-- 2. Giai đoạn cân bằng (đường đứt nét xen kẽ 2 màu) -->
            <path id="path-eq-thuan" class="line-eq-thuận" d=""/>
            <path id="path-eq-nghich" class="line-eq-nghịch" d=""/>

            <!-- 3. Đường gióng và nhãn tại cân bằng -->
            <path id="line-vertical-eq" class="line-dashed" d="" opacity="0"/>
            <text id="label-eq-main" x="650" y="230" class="label-eq">v thuận = v nghịch ≠ 0</text>
            <text id="label-eq-sub" x="650" y="590" class="label-eq" style="font-size: 18px; fill: #e2e8f0;">Thời điểm đạt trạng thái cân bằng</text>

            <!-- 4. Nhãn động và chú thích -->
            <text id="tag-thuan" x="0" y="0" class="label-thuận" opacity="0">v thuận</text>
            <text id="tag-nghich" x="0" y="0" class="label-nghịch" opacity="0">v nghịch</text>
            
            <!-- Hộp chứa text động -->
            <g id="moving-group" opacity="1">
                <rect x="0" y="0" width="240" height="30" fill="rgba(15, 23, 42, 0.7)" rx="5" id="moving-bg" transform="translate(-120, -20)"/>
                <text id="moving-text" x="0" y="0" class="moving-note">v thuận giảm, v nghịch tăng</text>
            </g>
        </svg>
    </div>

    <div id="controls">
        <div class="flex flex-col md:flex-row justify-center items-center gap-4 max-w-5xl mx-auto w-full">
            <button id="btn-play" class="btn btn-play flex-1 w-full" onclick="togglePlay()">Bắt đầu</button>
            <button class="btn btn-reset flex-1 w-full" onclick="resetGraph()">Xem lại</button>
            <button class="btn btn-fast flex-1 w-full" onclick="skipToEq()">Tiến tới cân bằng</button>
            <button class="btn btn-toggle flex-1 w-full" onclick="toggleNotes()">Ẩn/Hiện chú thích</button>
            <button class="btn bg-cyan-600 hover:bg-cyan-500 text-white flex-1 w-full" onclick="toggleQuiz()">Kiểm tra</button>
        </div>
        <div class="max-w-5xl mx-auto w-full flex items-center gap-4">
            <span class="font-bold text-gray-400 text-sm w-24">THỜI GIAN</span>
            <input type="range" id="time-slider" min="0" max="1000" value="0" oninput="seekGraph(this.value)">
        </div>
    </div>

    <!-- Vùng Câu hỏi (Mặc định ẩn) -->
    <div id="quiz-section" class="hidden p-6 my-6 max-w-5xl mx-auto w-full bg-slate-800 rounded-xl shadow-lg border border-slate-700 transition-all">
        <h2 class="text-2xl font-bold text-cyan-400 mb-6 border-b border-gray-600 pb-2">THỬ THÁCH KIẾN THỨC</h2>
        <div id="quiz-container" class="space-y-6">
            <!-- Quiz dynamically injected here -->
        </div>
        <div class="text-center mt-8">
            <button onclick="submitQuiz()" class="btn bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-lg shadow-lg">Nộp Bài & Xem Kết Quả</button>
        </div>
        <div id="quiz-result" class="hidden mt-6 p-6 rounded-lg bg-slate-900 border border-cyan-500 text-center">
            <h3 class="text-3xl font-bold text-white mb-2">Điểm của bạn: <span id="score-display" class="text-cyan-400"></span>/2</h3>
            <p id="score-message" class="text-gray-300 text-lg"></p>
        </div>
    </div>

    <script>
        // Hằng số đồ họa SVG
        const SVG_W = 1200;
        const SVG_H = 650;
        const X_START = 100;
        const X_MAX = 1100;
        const Y_BOTTOM = 550;
        
        // Thông số Toán học của hệ
        const X_EQ = 650; // Tọa độ X tại thời điểm cân bằng
        const Y_EQ = 280; // Tọa độ Y chung khi đạt cân bằng (khác 0 - Y=550 là 0)
        const Y_THUAN_START = 100; // Tốc độ thuận ban đầu cao
        const Y_NGHICH_START = 550; // Tốc độ nghịch ban đầu bằng 0 (nằm trên trục hoành)

        // Biến trạng thái
        let progress = 0; // 0 to 1000
        let isPlaying = false;
        let showNotes = true;
        let animId = null;
        let speed = 2.5; // Tốc độ vẽ

        // Các elements
        const pathThuan = document.getElementById('path-thuan');
        const pathNghich = document.getElementById('path-nghich');
        const pathEqThuan = document.getElementById('path-eq-thuan');
        const pathEqNghich = document.getElementById('path-eq-nghich');
        const lineVertical = document.getElementById('line-vertical-eq');
        const labelEqMain = document.getElementById('label-eq-main');
        const labelEqSub = document.getElementById('label-eq-sub');
        const tagThuan = document.getElementById('tag-thuan');
        const tagNghich = document.getElementById('tag-nghich');
        const movingGroup = document.getElementById('moving-group');
        const movingText = document.getElementById('moving-text');
        const slider = document.getElementById('time-slider');
        const btnPlay = document.getElementById('btn-play');

        // Hàm tính quỹ đạo cong (Easing cong mượt)
        function getVThuan(x) {
            if (x >= X_EQ) return Y_EQ;
            let t = (x - X_START) / (X_EQ - X_START); // 0 -> 1
            if (t < 0) t = 0;
            // Hàm cong: Y giảm dần về Y_EQ
            return Y_EQ - (Y_EQ - Y_THUAN_START) * Math.pow(1 - t, 2.5);
        }

        function getVNghich(x) {
            if (x >= X_EQ) return Y_EQ;
            let t = (x - X_START) / (X_EQ - X_START); // 0 -> 1
            if (t < 0) t = 0;
            // Hàm cong: Y tăng dần về Y_EQ (lưu ý Y lộn ngược trong SVG)
            return Y_EQ + (Y_NGHICH_START - Y_EQ) * Math.pow(1 - t, 2.5);
        }

        // Hàm vẽ cập nhật khung hình
        function renderGraph() {
            let currentX = X_START + (progress / 1000) * (X_MAX - X_START);

            // 1. Dựng mảng điểm cho đường biến thiên
            let dF = `M ${X_START},${Y_THUAN_START} `;
            let dR = `M ${X_START},${Y_NGHICH_START} `;
            
            let drawLimit = Math.min(currentX, X_EQ);
            
            for(let x = X_START; x <= drawLimit; x += 5) {
                dF += `L ${x},${getVThuan(x)} `;
                dR += `L ${x},${getVNghich(x)} `;
            }
            // Đảm bảo kết nối điểm cuối cùng chính xác
            dF += `L ${drawLimit},${getVThuan(drawLimit)}`;
            dR += `L ${drawLimit},${getVNghich(drawLimit)}`;

            pathThuan.setAttribute('d', dF);
            pathNghich.setAttribute('d', dR);

            // Cập nhật thẻ Tag bám theo đuôi đồ thị
            tagThuan.setAttribute('x', drawLimit - 20);
            tagThuan.setAttribute('y', getVThuan(drawLimit) - 15);
            tagThuan.setAttribute('opacity', 1);

            tagNghich.setAttribute('x', drawLimit - 20);
            tagNghich.setAttribute('y', getVNghich(drawLimit) + 25);
            tagNghich.setAttribute('opacity', 1);

            // Cập nhật Text di chuyển "v thuận giảm, v nghịch tăng"
            if (showNotes && currentX > X_START + 50 && currentX < X_EQ) {
                movingGroup.setAttribute('opacity', 1);
                // Vị trí text ở giữa 2 đường
                let midY = (getVThuan(drawLimit) + getVNghich(drawLimit)) / 2;
                movingGroup.setAttribute('transform', `translate(${drawLimit}, ${midY})`);
            } else {
                movingGroup.setAttribute('opacity', 0);
            }

            // 2. Dựng đoạn trạng thái cân bằng (sau X_EQ)
            if (currentX > X_EQ) {
                // Hiển thị cả 2 đường đứt nét đè lên nhau
                let dEq = `M ${X_EQ},${Y_EQ} L ${currentX},${Y_EQ}`;
                pathEqThuan.setAttribute('d', dEq);
                pathEqNghich.setAttribute('d', dEq);
                
                // Kéo tag chữ đi tiếp theo đường cân bằng
                tagThuan.setAttribute('x', currentX - 20);
                tagThuan.setAttribute('y', Y_EQ - 15);
                tagNghich.setAttribute('x', currentX - 20);
                tagNghich.setAttribute('y', Y_EQ + 25);

                // Hiện vạch đứt dọc và text
                lineVertical.setAttribute('d', `M ${X_EQ},550 L ${X_EQ},${Y_EQ}`);
                lineVertical.setAttribute('opacity', 1);
                
                if (showNotes) {
                    labelEqMain.style.opacity = 1;
                    labelEqSub.style.opacity = 1;
                }
            } else {
                pathEqThuan.setAttribute('d', '');
                pathEqNghich.setAttribute('d', '');
                lineVertical.setAttribute('opacity', 0);
                labelEqMain.style.opacity = 0;
                labelEqSub.style.opacity = 0;
            }

            // Đồng bộ thanh trượt
            slider.value = progress;
        }

        // Vòng lặp animation
        function loop() {
            if (!isPlaying) return;
            progress += speed;
            if (progress >= 1000) {
                progress = 1000;
                isPlaying = false;
                btnPlay.textContent = "Bắt đầu";
                btnPlay.classList.replace('btn-pause', 'btn-play');
            }
            renderGraph();
            if (isPlaying) animId = requestAnimationFrame(loop);
        }

        // Điều khiển chức năng
        function togglePlay() {
            if (progress >= 1000) {
                progress = 0; // Restart if at end
            }
            isPlaying = !isPlaying;
            if (isPlaying) {
                btnPlay.textContent = "Tạm dừng";
                btnPlay.classList.replace('btn-play', 'btn-pause');
                loop();
            } else {
                btnPlay.textContent = "Tiếp tục";
                btnPlay.classList.replace('btn-pause', 'btn-play');
                cancelAnimationFrame(animId);
            }
        }

        function resetGraph() {
            isPlaying = false;
            progress = 0;
            cancelAnimationFrame(animId);
            btnPlay.textContent = "Bắt đầu";
            btnPlay.classList.replace('btn-pause', 'btn-play');
            renderGraph();
        }

        function skipToEq() {
            isPlaying = false;
            cancelAnimationFrame(animId);
            btnPlay.textContent = "Tiếp tục";
            btnPlay.classList.replace('btn-pause', 'btn-play');
            // Tính progress tại X_EQ
            progress = ((X_EQ - X_START) / (X_MAX - X_START)) * 1000;
            renderGraph();
        }

        function toggleNotes() {
            showNotes = !showNotes;
            renderGraph();
        }

        function seekGraph(val) {
            progress = parseFloat(val);
            // Nếu kéo slider thì tạm dừng
            isPlaying = false;
            btnPlay.textContent = "Tiếp tục";
            btnPlay.classList.replace('btn-pause', 'btn-play');
            cancelAnimationFrame(animId);
            renderGraph();
        }

        // Khởi tạo ban đầu
        window.onload = () => {
            renderGraph();
            initQuiz();
        };

        // --- HỆ THỐNG CÂU HỎI TRẮC NGHIỆM ---
        const quizData = [
            {
                q: "Câu 1. Trong quá trình tiến tới trạng thái cân bằng, tốc độ phản ứng thay đổi như thế nào?",
                opts: ["A. v thuận và v nghịch đều giảm", "B. v thuận tăng, v nghịch giảm", "C. v thuận giảm, v nghịch tăng", "D. v thuận giảm, v nghịch không đổi"],
                ans: 2, // C
                exp: "Nồng độ chất tham gia giảm dần làm tốc độ phản ứng thuận giảm; nồng độ sản phẩm tăng dần làm tốc độ phản ứng nghịch tăng."
            },
            {
                q: "Câu 2. Tại thời điểm đồ thị hai đường gặp nhau và đi ngang, khẳng định nào sau đây ĐÚNG về bản chất cân bằng động?",
                opts: ["A. Phản ứng đã dừng lại hoàn toàn.", "B. v thuận = v nghịch = 0", "C. Chỉ còn phản ứng nghịch tiếp diễn.", "D. Phản ứng thuận và nghịch vẫn xảy ra với v thuận = v nghịch ≠ 0."],
                ans: 3, // D
                exp: "Cân bằng hóa học là cân bằng động. Cả hai phản ứng vẫn liên tục diễn ra nhưng với tốc độ bằng nhau nên nồng độ các chất không đổi (khác 0)."
            }
        ];

        let userAnswers = [null, null];

        function toggleQuiz() {
            const qs = document.getElementById('quiz-section');
            qs.classList.toggle('hidden');
            if(!qs.classList.contains('hidden')) {
                qs.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            quizData.forEach((q, qIndex) => {
                let optionsHtml = '';
                q.opts.forEach((opt, oIndex) => {
                    optionsHtml += `
                        <label class="flex items-center p-4 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer hover:bg-slate-700 transition radio-q${qIndex}">
                            <input type="radio" name="q${qIndex}" value="${oIndex}" onchange="selectOption(${qIndex}, ${oIndex})" class="w-5 h-5 text-cyan-500 bg-slate-800 border-slate-600 focus:ring-cyan-500">
                            <span class="ml-3 text-gray-200">${opt}</span>
                        </label>
                    `;
                });
                container.innerHTML += `
                    <div class="bg-slate-800 p-5 rounded-lg border border-slate-600">
                        <h4 class="text-lg font-semibold text-white mb-4">${q.q}</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${optionsHtml}
                        </div>
                        <div id="fb-q${qIndex}" class="hidden mt-4 p-4 rounded-lg text-sm text-gray-200"></div>
                    </div>
                `;
            });
        }

        function selectOption(qIndex, oIndex) {
            userAnswers[qIndex] = oIndex;
            const labels = document.querySelectorAll(`.radio-q${qIndex}`);
            labels.forEach(l => {
                l.classList.remove('border-cyan-400', 'bg-cyan-900/30');
                l.classList.add('border-slate-700', 'bg-slate-900');
            });
            labels[oIndex].classList.replace('border-slate-700', 'border-cyan-400');
            labels[oIndex].classList.replace('bg-slate-900', 'bg-cyan-900/30');
        }

        function submitQuiz() {
            if (userAnswers.includes(null)) {
                alert("Vui lòng trả lời đầy đủ 2 câu hỏi trước khi nộp bài!");
                return;
            }
            let score = 0;
            quizData.forEach((q, qIndex) => {
                const fbDiv = document.getElementById(`fb-q${qIndex}`);
                const isCorrect = userAnswers[qIndex] === q.ans;
                if (isCorrect) {
                    score++;
                    fbDiv.className = "mt-4 p-4 rounded-lg bg-green-900/40 border border-green-500 text-green-200 block";
                    fbDiv.innerHTML = `<strong>✅ Chính xác!</strong><br>${q.exp}`;
                } else {
                    fbDiv.className = "mt-4 p-4 rounded-lg bg-red-900/40 border border-red-500 text-red-200 block";
                    fbDiv.innerHTML = `<strong>❌ Sai rồi. Đáp án đúng: ${q.opts[q.ans].substring(0,2)}</strong><br>${q.exp}`;
                }
                
                // Vô hiệu hóa lựa chọn sau khi nộp
                document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(inp => inp.disabled = true);
            });
            
            document.getElementById('score-display').innerText = score;
            const msg = document.getElementById('score-message');
            if(score === 2) msg.innerText = "Xuất sắc! Bạn đã hiểu rõ bản chất của đồ thị và trạng thái cân bằng hóa học.";
            else if(score === 1) msg.innerText = "Khá tốt! Hãy đọc lại phần giải thích ở câu bạn làm sai nhé.";
            else msg.innerText = "Chưa chính xác. Hãy dùng thanh thời gian để quan sát kỹ đồ thị một lần nữa và thử lại.";
            
            const res = document.getElementById('quiz-result');
            res.classList.remove('hidden');
            res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            event.target.style.display = 'none'; // Ẩn nút nộp bài
        }

    </script>
</body>
</html>
